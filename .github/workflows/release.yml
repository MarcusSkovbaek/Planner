name: Release

# Publishes a signed update. Push a tag that matches package.json, e.g.:
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish (Windows)
    runs-on: windows-latest
    # Store PLANNER_UPDATE_SIGNING_KEY as a secret of this environment and protect it
    # with required reviewers, so no release can be signed without your approval.
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath 'release/win-unpacked/Planner.exe' -ArgumentList "--smoke-test=$report" -PassThru -Wait
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - name: Sign the update (refuses without a trusted key)
        shell: bash
        env:
          PLANNER_UPDATE_SIGNING_KEY: ${{ secrets.PLANNER_UPDATE_SIGNING_KEY }}
        run: |
          node scripts/sign-update.mjs \
            --installer "release/Planner-Setup-${GITHUB_REF_NAME#v}.exe" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/Planner-Setup-${GITHUB_REF_NAME#v}.exe" \
            release/update.json \
            --title "Planner ${GITHUB_REF_NAME#v}" \
            --generate-notes
