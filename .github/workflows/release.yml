name: Release

# Publishes a signed update. Push a tag that matches package.json, e.g.:
#   npm version patch && git push --follow-tags
#
# The signing key is kept away from third-party code: the build (npm packages, tests,
# packaging) runs without it, and only the publish job gets it, after you approve the
# run in the protected `release` environment. That job installs no npm packages; besides
# GitHub's own checkout/setup/download actions it runs only this repository's signing
# script, which uses Node built-ins only.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    name: Check tag and signing key
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: The app must trust an update key
        run: |
          if ! grep -Eq "id: '[0-9a-f]{16}'" src/main/update/trustedKeys.ts; then
            echo "::error::src/main/update/trustedKeys.ts has no key, so installed apps could not verify this update. Run npm run update:keygen first (see README)."
            exit 1
          fi

  build:
    name: Windows
    needs: verify
    uses: ./.github/workflows/build-windows.yml
    with:
      npm-cache: false

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # PLANNER_UPDATE_SIGNING_KEY is a secret of this environment. Protect it with required
    # reviewers so no update can be signed without your approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # Fails if the file differs from what the build job uploaded.
      - uses: actions/download-artifact@v8
        with:
          name: Planner-Windows-installer
          path: release
      - name: Sign the update (refuses keys the app does not trust)
        env:
          PLANNER_UPDATE_SIGNING_KEY: ${{ secrets.PLANNER_UPDATE_SIGNING_KEY }}
        run: |
          node scripts/sign-update.mjs \
            --installer "release/Planner-Setup-${GITHUB_REF_NAME#v}.exe" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/Planner-Setup-${GITHUB_REF_NAME#v}.exe" \
            release/update.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Planner ${GITHUB_REF_NAME#v}" \
            --generate-notes
