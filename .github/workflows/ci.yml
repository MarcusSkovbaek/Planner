name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI runs third-party npm code, so it gets read-only access and no secrets.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit & end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Electron smoke test (demo provider)
        run: |
          npm run build
          xvfb-run -a npx electron . --no-sandbox --demo --smoke-test=smoke-linux.json
          cat smoke-linux.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  windows:
    name: Windows
    uses: ./.github/workflows/build-windows.yml
